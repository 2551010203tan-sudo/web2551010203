<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Chương 3 - Bài 5 - Movie Website</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #141414;
            color: #ffffff;
        }

        /* Thanh Navigation / Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background-color: #000;
        }

        .logo {
            color: #e50914;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links a {
            color: #e5e5e5;
            text-decoration: none;
            margin-left: 20px;
            font-size: 13px;
        }

        /* Hero Banner */
        .hero-banner {
            height: 220px;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(20,20,20,1)), #777;
            display: flex;
            align-items: flex-end;
            padding: 30px 40px;
            background-size: cover;
            background-position: center;
        }

        .hero-banner h1 {
            font-size: 28px;
            font-weight: bold;
        }

        /* Khu vực danh sách phim */
        .section {
            padding: 20px 40px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #e5e5e5;
        }

        .movie-grid {
            display: flex;
            gap: 15px;
        }

        .movie-card {
            position: relative;
            width: 150px;
            height: 220px;
            border-radius: 4px;
            overflow: visible;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }

        /* Hiệu ứng khi rê chuột (Hover) */
        .movie-card:hover {
            transform: scale(1.15);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        /* Nhãn HOT */
        .badge-hot {
            position: absolute;
            top: 5px;
            left: 5px;
            background-color: #e50914;
            color: white;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 2px;
            z-index: 2;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo">NETFLIX</div>
        <div class="nav-links">
            <a href="#">Trang chủ</a>
            <a href="#">Phim</a>
            <a href="#">Thể loại</a>
        </div>
    </div>

    <!-- Banner chính -->
    <div class="hero-banner">
        <h1>Phim nổi bật hôm nay</h1>
    </div>

    <!-- Hàng 1: Xu hướng -->
    <div class="section">
        <div class="section-title">Xu hướng</div>
        <div class="movie-grid">
            <div class="movie-card">
                <span class="badge-hot">HOT</span>
                <img src="../images/p1.jpg" alt="Drishyam 2">
            </div>
            <div class="movie-card">
                <img src="../images/p2.jpg" alt="Encanto">
            </div>
            <div class="movie-card">
                <img src="../images/p3.jpg" alt="Wicked">
            </div>
            <div class="movie-card">
                <img src="../images/p4.jpg" alt="Jumanji">
            </div>
            <div class="movie-card">
                <img src="../images/p5.jpg" alt="Black Panther">
            </div>
        </div>
    </div>

    <!-- Hàng 2: Mới phát hành -->
    <div class="section">
        <div class="section-title">Mới phát hành</div>
        <div class="movie-grid">
            <div class="movie-card">
                <img src="../images/p6.jpg" alt="Scary Movie">
            </div>
            <div class="movie-card">
                <img src="../images/p7.jpg" alt="Sinners">
            </div>
            <div class="movie-card">
                <img src="../images/p8.jpg" alt="The Manager">
            </div>
            <div class="movie-card">
                <img src="../images/p9.jpg" alt="Us">
            </div>
            <div class="movie-card">
                <img src="../images/p10.jpg" alt="Wonka">
            </div>
        </div>
    </div>

    <br><hr>
    <p align="center"><a href="../web.html" style="color: #fff;">Quay lại danh sách</a></p>

</body>
</html>
