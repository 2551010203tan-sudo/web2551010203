<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bài tập 06 - Media Player</title>
</head>
<body>

    <div align="center">
        <!-- 1. Audio Player -->
        <h2>Audio Player</h2>
        <audio controls>
            <source src="../images/audio.mp3" type="audio/mpeg">
            Trình duyệt của bạn không hỗ trợ thẻ audio.
        </audio>

        <br><br>

        <!-- 2. Video Player -->
        <h2>Video Player</h2>
        <video width="480" height="270" controls>
            <source src="../images/video.mp4" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ thẻ video.
        </video>

        <br><br>

        <!-- 3. Youtube Player -->
        <h2>Youtube Player</h2>
        <iframe 
            width="480" 
            height="270" 
            src="https://www.youtube.com/embed/dg4Byky2oLk" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

    <br>
    <hr width="80%" align="center">
    <p align="center"><a href="../web.html">Quay lại danh sách</a></p>

</body>
</html>
